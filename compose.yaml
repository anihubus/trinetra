name: drishti


services:

  # ------------------------------------------------
  # PostgreSQL
  # ------------------------------------------------

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drishti}
      POSTGRES_USER: ${POSTGRES_USER:-drishti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drishti}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-drishti}"
        ]

      interval: 5s
      timeout: 3s
      retries: 10


  # ------------------------------------------------
  # Redis
  # ------------------------------------------------

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 3s
      retries: 10


volumes:

  pgdata: